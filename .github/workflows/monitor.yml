name: Pokemon Monitor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python pokemon_bot.py
